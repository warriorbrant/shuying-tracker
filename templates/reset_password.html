<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 · 知行合一AI实验室</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#b5654a">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
</head>
<body>
  <main class="login-wrap">
    {% if not valid %}
    <div class="form login-form-box">
      <h1 class="login-title">📚🎬 知行合一AI实验室</h1>
      <p class="login-error">这个重置链接无效或者已经用过/过期了，找管理员再要一个新的。</p>
      <a class="login-back" href="{{ url_for('login') }}">← 返回登录</a>
    </div>
    {% elif done %}
    <div class="form login-form-box">
      <h1 class="login-title">📚🎬 知行合一AI实验室</h1>
      <p>密码重置好了。</p>
      <a class="login-back" href="{{ url_for('login') }}">→ 去登录</a>
    </div>
    {% else %}
    <form class="form login-form-box" method="post">
      <h1 class="login-title">📚🎬 知行合一AI实验室</h1>
      <label>
        新密码
        <input type="password" name="password" autofocus required autocomplete="new-password" minlength="6">
      </label>
      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
      <button type="submit">设置新密码</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
