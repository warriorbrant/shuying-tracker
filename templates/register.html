<!doctype html>
<html lang="{{ 'en' if current_lang == 'en' else 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tr('注册 · 知行合一AI实验室') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#b5654a">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
</head>
<body>
  <main class="login-wrap">
    <form class="form login-form-box" method="post">
      <div class="changelog-header-row">
        <h1 class="login-title">{{ tr('🧭 知行合一AI实验室') }}</h1>
        <a class="lang-switch" href="{{ lang_toggle_url }}">{{ '中文' if current_lang == 'en' else 'EN' }}</a>
      </div>
      <label>
        {{ tr('用户名') }}
        <input type="text" name="username" autofocus required autocomplete="username">
      </label>
      <label>
        {{ tr('密码') }}
        <input type="password" name="password" required autocomplete="new-password" minlength="6">
      </label>
      {% if error %}<p class="login-error">{{ tr(error) }}</p>{% endif %}
      <button type="submit">{{ tr('注册') }}</button>
      <a class="login-back" href="{{ url_for('login') }}">{{ tr('已经有账号？去登录 →') }}</a>
      <a class="login-back" href="{{ url_for('index') }}">{{ tr('← 返回公开主页') }}</a>
    </form>
  </main>
</body>
</html>
