{% for log in logs %}
<li class="log-item">
  <div class="log-meta">
    <strong>{{ log.log_date }}</strong>
    <span>{{ tr('⏱ {m} 分钟', m=log.minutes_spent) }}</span>
    {% if log.progress_at is not none %}<span>{{ tr('进度：{p} {u}', p=log.progress_at | round(1), u=item.unit_label) }}</span>{% endif %}
  </div>
  {% if log.comment %}<p class="log-comment">{{ log.comment }}</p>{% endif %}
  <form method="post" action="{{ url_for('log_delete', log_id=log.id) }}"
        onsubmit="return confirm({{ tr('删除这条记录？') | tojson }});">
    <button type="submit" class="btn-link-danger">{{ tr('删除') }}</button>
  </form>
</li>
{% endfor %}
